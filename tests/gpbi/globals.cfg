# Global Configuration for Bridge GPBI Tests

# Load local .env if it exists
if [ -f "$(dirname "${BASH_SOURCE[0]}")/.env" ]; then
    set -a
    source "$(dirname "${BASH_SOURCE[0]}")/.env"
    set +a
fi

PROVIDER="google_play"
PACKAGE_NAME="com.hiha.fe"

PRODUCT_ID_OTP="hiha_one_time"
PRODUCT_ID_SUB="hiha_monthly"

GCP_PROJECT_ID="play-billing-482404"

# Bridge API
BRIDGE_API_URL="${BRIDGE_API_URL:-http://localhost:5566}"

# Bridge Database
BRIDGE_DB_HOST="${BRIDGE_DB_HOST:-localhost}"
BRIDGE_DB_PORT=${BRIDGE_DB_PORT:-5432}
BRIDGE_DB_USER="${BRIDGE_DB_USER:-bridge_admin}"
BRIDGE_DB_NAME="${BRIDGE_DB_NAME:-appgen}"

# Database password (default to postgres as per Bridge convention)
export PGPASSWORD="${DATABASE_PASSWORD:-password}"

BRIDGE_DB_URL="${BRIDGE_DB_URL:-postgresql://${BRIDGE_DB_USER}:${PGPASSWORD}@${BRIDGE_DB_HOST}/${BRIDGE_DB_NAME}}"

# Fetch BRIDGE_APP_ID and WEBHOOK_TOKEN for 'hiha' slug
APP_INFO=$(psql -U "$BRIDGE_DB_USER" -h "$BRIDGE_DB_HOST" -p "$BRIDGE_DB_PORT" -d "$BRIDGE_DB_NAME" \
  -c "SELECT id, webhook_ingress_token FROM pay.apps WHERE slug = 'hiha' AND enabled = true LIMIT 1;" -t | tr -d '[:space:]' || echo "")

if [[ -n "$APP_INFO" ]]; then
    BRIDGE_APP_ID=$(echo "$APP_INFO" | cut -d'|' -f1)
    WEBHOOK_TOKEN=$(echo "$APP_INFO" | cut -d'|' -f2)
    # Note: BRIDGE_API_KEY cannot be fetched from DB (it is hashed); using .env fallback
else
    # Fallback to values optionally provided in .env (or environment)
    BRIDGE_APP_ID="${BRIDGE_APP_ID:-}"
    WEBHOOK_TOKEN="${WEBHOOK_TOKEN:-${WEBHOOK_INGRESS_TOKEN:-}}"
    BRIDGE_API_KEY="${BRIDGE_API_KEY:-}"
fi

export BRIDGE_APP_ID
export WEBHOOK_TOKEN
export BRIDGE_API_KEY
export BRIDGE_WEBHOOK_FUTURE_TS=$(($(date +%s) + 600))000

bridge_log_marker() {
    local message="${1:-}"

    if [[ -z "$message" ]]; then
        return 0
    fi

    local escaped_message
    escaped_message=$(printf '%s' "$message" | sed 's/\\/\\\\/g; s/"/\\"/g')

    curl -fsS -m 2 \
        -H "Content-Type: application/json" \
        -X POST "$BRIDGE_API_URL/internal/test/log-marker" \
        -d "{\"message\":\"$escaped_message\"}" \
        >/dev/null 2>&1 || true
}

# HiHa Database (for optional verification)
HIHA_DB_HOST="localhost"
HIHA_DB_PORT=5432
HIHA_DB_USER="hiha_user"
HIHA_DB_NAME="hiha"
HIHA_DB_URL="${HIHA_DB_URL:-postgresql://${HIHA_DB_USER}:${PGPASSWORD}@${HIHA_DB_HOST}/${HIHA_DB_NAME}}"
