# Global Configuration for Creem Billing Integration (CBI) Tests

# Load local .env if it exists
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
if [ -f "$SCRIPT_DIR/.env" ]; then
    set -a
    source "$SCRIPT_DIR/.env"
    set +a
fi

PROVIDER="creem"
PRODUCT_ID_OTP="${PRODUCT_ID_OTP:-prod_ci_test_one_time}"
PRODUCT_ID_SUB="${PRODUCT_ID_SUB:-prod_ci_test_subscription}"
SUBSCRIPTION_ID="${SUBSCRIPTION_ID:-subscription_12345}"
EMAIL="${EMAIL:-creem_tester@example.com}"

# Bridge API
BRIDGE_API_URL="${BRIDGE_API_URL:-http://localhost:5566}"
APP_URL="$BRIDGE_API_URL"

# Bridge Database
BRIDGE_DB_HOST="${BRIDGE_DB_HOST:-localhost}"
BRIDGE_DB_PORT=${BRIDGE_DB_PORT:-5432}
BRIDGE_DB_USER="${BRIDGE_DB_USER:-bridge_admin}"
BRIDGE_DB_NAME="${BRIDGE_DB_NAME:-appgen}"

# Database password (default to postgres as per Bridge convention)
export PGPASSWORD="${DATABASE_PASSWORD:-password}"

# Fetch BRIDGE_APP_ID and WEBHOOK_INGRESS_TOKEN for 'hiha' slug
APP_INFO=$(psql -U "$BRIDGE_DB_USER" -h "$BRIDGE_DB_HOST" -p "$BRIDGE_DB_PORT" -d "$BRIDGE_DB_NAME" \
  -c "SELECT id, webhook_ingress_token FROM pay.apps WHERE slug = 'hiha' AND enabled = true LIMIT 1;" -t | tr -d '[:space:]' || echo "")

if [[ -n "$APP_INFO" ]]; then
    BRIDGE_APP_ID=$(echo "$APP_INFO" | cut -d'|' -f1)
    WEBHOOK_INGRESS_TOKEN=$(echo "$APP_INFO" | cut -d'|' -f2)
else
    # Fallback to values optionally provided in .env (or environment)
    BRIDGE_APP_ID="${BRIDGE_APP_ID:-}"
    WEBHOOK_INGRESS_TOKEN="${WEBHOOK_INGRESS_TOKEN:-}"
fi
BRIDGE_API_KEY="${BRIDGE_API_KEY:-}"
export BRIDGE_API_KEY


bridge_log_marker() {
    local message="${1:-}"

    if [[ -z "$message" ]]; then
        return 0
    fi

    local escaped_message
    escaped_message=$(printf '%s' "$message" | sed 's/\\/\\\\/g; s/"/\\"/g')

    curl -fsS -m 2 \
        -H "Content-Type: application/json" \
        -X POST "$BRIDGE_API_URL/internal/test/log-marker" \
        -d "{\"message\":\"$escaped_message\"}" \
        >/dev/null 2>&1 || true
}

export BRIDGE_APP_ID
export WEBHOOK_INGRESS_TOKEN
export BRIDGE_API_KEY
export PROVIDER
export BRIDGE_API_URL
export BRIDGE_DB_HOST
export BRIDGE_DB_PORT
export BRIDGE_DB_USER
export BRIDGE_DB_NAME
export EMAIL

# Note: To use X-Webhook-Verification-Mode header override in webhook tests,
# the backend must run with MOCK_EXTERNAL_APIS=true (see .env).
# Without it, the header is ignored and real signature verification is enforced.
