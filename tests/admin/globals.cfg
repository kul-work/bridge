# Global Configuration for Bridge Admin Interface Tests

# Load local .env if it exists
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
if [ -f "$SCRIPT_DIR/../cti/.env" ]; then
    set -a
    source "$SCRIPT_DIR/../cti/.env"
    set +a
elif [ -f "$SCRIPT_DIR/.env" ]; then
    set -a
    source "$SCRIPT_DIR/.env"
    set +a
fi

# Bridge API
BRIDGE_API_URL="${BRIDGE_API_URL:-http://localhost:5566}"

# Bridge Database
BRIDGE_DB_HOST="${BRIDGE_DB_HOST:-localhost}"
BRIDGE_DB_PORT=${BRIDGE_DB_PORT:-5432}
BRIDGE_DB_USER="${BRIDGE_DB_USER:-bridge_admin}"
BRIDGE_DB_NAME="${BRIDGE_DB_NAME:-appgen}"

export PGPASSWORD="${DATABASE_PASSWORD:-postgres}"

BRIDGE_DB_URL="${BRIDGE_DB_URL:-postgresql://${BRIDGE_DB_USER}:${PGPASSWORD}@${BRIDGE_DB_HOST}/${BRIDGE_DB_NAME}}"

# Clerk Mock Server Configuration
MOCK_CLERK_PORT=5577
MOCK_CLERK_URL="http://localhost:$MOCK_CLERK_PORT"

# Fetch an enabled app for admin testing
fetch_any_app_info() {
    psql -U "$BRIDGE_DB_USER" -h "$BRIDGE_DB_HOST" -p "$BRIDGE_DB_PORT" -d "$BRIDGE_DB_NAME" \
        -c "SELECT id, webhook_ingress_token, slug FROM pay.apps WHERE enabled = true LIMIT 1;" -t | tr -d '[:space:]' 2>/dev/null || echo ""
}

APP_INFO=$(fetch_any_app_info)
if [[ -n "$APP_INFO" ]]; then
    BRIDGE_APP_ID=$(echo "$APP_INFO" | cut -d'|' -f1)
    WEBHOOK_INGRESS_TOKEN=$(echo "$APP_INFO" | cut -d'|' -f2)
    BRIDGE_APP_SLUG=$(echo "$APP_INFO" | cut -d'|' -f3)
else
    BRIDGE_APP_ID="${BRIDGE_APP_ID:-}"
    WEBHOOK_INGRESS_TOKEN="${WEBHOOK_INGRESS_TOKEN:-}"
    BRIDGE_APP_SLUG="${BRIDGE_APP_SLUG:-hiha}"
fi

export BRIDGE_API_URL
export BRIDGE_DB_HOST
export BRIDGE_DB_PORT
export BRIDGE_DB_USER
export BRIDGE_DB_NAME
export BRIDGE_APP_ID
export WEBHOOK_INGRESS_TOKEN
export BRIDGE_APP_SLUG
export MOCK_CLERK_PORT
export MOCK_CLERK_URL
