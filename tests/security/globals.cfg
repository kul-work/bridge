# Global configuration for Bridge security tests.
#
# Security tests run against a live Bridge backend using real app API keys.
# They verify cross-app tenant isolation: App B's API key must not be able to
# read or mutate App A's payment/subscription data.
#
# Keep machine-specific values in tests/security/.env.

SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

if [ -f "$SCRIPT_DIR/.env" ]; then
    set -a
    source "$SCRIPT_DIR/.env"
    set +a
fi

: "${BRIDGE_API_URL:=http://localhost:5566}"

: "${BRIDGE_DB_HOST:=localhost}"
: "${BRIDGE_DB_PORT:=5432}"
: "${BRIDGE_DB_NAME:=appgen}"
: "${BRIDGE_DB_USER:=bridge_admin}"
: "${PGPASSWORD:=postgres}"

# App A = data owner (hiha), App B = cross-app attacker (household).
: "${BRIDGE_APP_A_SLUG:=hiha}"
: "${BRIDGE_APP_B_SLUG:=household}"

export BRIDGE_API_URL
export BRIDGE_DB_HOST
export BRIDGE_DB_PORT
export BRIDGE_DB_NAME
export BRIDGE_DB_USER
export PGPASSWORD
export BRIDGE_APP_A_SLUG
export BRIDGE_APP_B_SLUG
