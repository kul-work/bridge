# Global Configuration for CTI (Contract & Tenant Isolation) Tests

# Load local .env if it exists
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
if [ -f "$SCRIPT_DIR/.env" ]; then
    set -a
    source "$SCRIPT_DIR/.env"
    set +a
fi

# Bridge API
BRIDGE_API_URL="${BRIDGE_API_URL:-http://localhost:5566}"

# Bridge Database
BRIDGE_DB_HOST="${BRIDGE_DB_HOST:-localhost}"
BRIDGE_DB_PORT=${BRIDGE_DB_PORT:-5432}
BRIDGE_DB_USER="${BRIDGE_DB_USER:-bridge_admin}"
BRIDGE_DB_NAME="${BRIDGE_DB_NAME:-appgen}"

export PGPASSWORD="${DATABASE_PASSWORD:-password}"

BRIDGE_DB_URL="${BRIDGE_DB_URL:-postgresql://${BRIDGE_DB_USER}:${PGPASSWORD}@${BRIDGE_DB_HOST}/${BRIDGE_DB_NAME}}"

# Fetch two apps for cross-app isolation tests.
# APP_A is the primary app (usually 'hiha'), APP_B is the secondary (usually 'household').
# Both must be enabled in pay.apps.

fetch_app_info() {
    local slug="$1"
    psql -U "$BRIDGE_DB_USER" -h "$BRIDGE_DB_HOST" -p "$BRIDGE_DB_PORT" -d "$BRIDGE_DB_NAME" \
        -c "SELECT id, webhook_ingress_token FROM pay.apps WHERE slug = '$slug' AND enabled = true LIMIT 1;" -t | tr -d '[:space:]' 2>/dev/null || echo ""
}

# App A (primary)
APP_A_SLUG="${APP_A_SLUG:-hiha}"
APP_A_INFO=$(fetch_app_info "$APP_A_SLUG")
if [[ -n "$APP_A_INFO" ]]; then
    APP_A_ID=$(echo "$APP_A_INFO" | cut -d'|' -f1)
    APP_A_WEBHOOK_TOKEN=$(echo "$APP_A_INFO" | cut -d'|' -f2)
else
    APP_A_ID="${APP_A_ID:-}"
    APP_A_WEBHOOK_TOKEN="${APP_A_WEBHOOK_TOKEN:-}"
fi
APP_A_API_KEY="${APP_A_API_KEY:-}"

# App B (secondary — for isolation tests, must be a DIFFERENT app)
APP_B_SLUG="${APP_B_SLUG:-household}"
APP_B_INFO=$(fetch_app_info "$APP_B_SLUG")
if [[ -n "$APP_B_INFO" ]]; then
    APP_B_ID=$(echo "$APP_B_INFO" | cut -d'|' -f1)
    APP_B_WEBHOOK_TOKEN=$(echo "$APP_B_INFO" | cut -d'|' -f2)
else
    APP_B_ID="${APP_B_ID:-}"
    APP_B_WEBHOOK_TOKEN="${APP_B_WEBHOOK_TOKEN:-}"
fi
APP_B_API_KEY="${APP_B_API_KEY:-}"


# For CONTRACT tests, App A is used as the primary app
BRIDGE_APP_ID="$APP_A_ID"
BRIDGE_API_KEY="${APP_A_API_KEY:-}"
WEBHOOK_INGRESS_TOKEN="$APP_A_WEBHOOK_TOKEN"

# Test product IDs (reuse from either suite; these are opaque to Bridge)
PRODUCT_ID_SUB="test_cti_subscription"
PRODUCT_ID_OTP="test_cti_otp"

export BRIDGE_API_URL
export BRIDGE_DB_HOST
export BRIDGE_DB_PORT
export BRIDGE_DB_USER
export BRIDGE_DB_NAME
export APP_A_ID
export APP_A_SLUG
export APP_A_API_KEY
export APP_A_WEBHOOK_TOKEN
export APP_B_ID
export APP_B_SLUG
export APP_B_API_KEY
export APP_B_WEBHOOK_TOKEN
export BRIDGE_APP_ID
export BRIDGE_API_KEY
export WEBHOOK_INGRESS_TOKEN
export PRODUCT_ID_SUB
export PRODUCT_ID_OTP