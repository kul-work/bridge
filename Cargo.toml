[package]
name = "bridge"
version = "0.1.0"
edition = "2021"
description = "A multi-payments middle-gateway application"

[[bin]]
name = "bridge"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid"] }
reqwest = { version = "0.12", features = ["json"] }
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
tracing = "0.1"
tracing-attributes = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
bytes = "1"
http = "1"
tera = "1"
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
regex = "1"
base64 = "0.22"
rsa = "0.9"
backoff = { version = "0.4", features = ["tokio"] }
semver = "1.0"

[dev-dependencies]
walkdir = "2.5.0"

[profile.dev]
incremental = true
debug = 0             # Reduces size of debug artifacts

[profile.release]
lto = "thin"          # Enables Link Time Optimization (smaller/faster binary)
codegen-units = 1     # Slower build, but much better optimization and smaller binary
strip = "symbols"     # Automatically strips debug symbols from the final binary
